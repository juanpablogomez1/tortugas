<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Las Tortugas Golf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky scoreboard header + tab rail; each view is a stack of panels on a fairway-green ground with bone cards. */
:root{
  --bg:#eef0e8; --card:#fbfbf6; --card2:#f1f3ea; --line:#d5dac8; --fg:#17251c; --muted:#5d6b60; --faint:#8a9688;
  --accent:#1f7a4a; --accent-ink:#ffffff; --amber:#c9811e; --amber-ink:#2a1a05;
  --good:#1f7a4a; --bad:#b4362f; --warn:#c9811e;
  --s1:#1f7a4a; --s2:#2f6fb0;
  --hero:#102b1c; --hero-fg:#f3f5ea; --hero-muted:#a9bba9;
  --heat0:#e6ebdd; --heat1:#bfd6c3; --heat2:#8fbc9c; --heat3:#4f9a6a; --heat4:#1f7a4a;
  --shadow:0 1px 2px rgba(20,40,25,.08),0 8px 24px -12px rgba(20,40,25,.25);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1713; --card:#172119; --card2:#1d2a21; --line:#2c3a30; --fg:#eef2e8; --muted:#a7b5a8; --faint:#6f7f72;
  --accent:#3fa36b; --accent-ink:#06130b; --amber:#d9862a; --amber-ink:#1c1105;
  --good:#3fa36b; --bad:#e06b63; --warn:#d9862a;
  --s1:#3fa36b; --s2:#5b93d6;
  --hero:#0b1a11; --hero-fg:#f3f5ea; --hero-muted:#93a596;
  --heat0:#1a241d; --heat1:#234a32; --heat2:#2b6b45; --heat3:#36905a; --heat4:#4fbf7d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1713; --card:#172119; --card2:#1d2a21; --line:#2c3a30; --fg:#eef2e8; --muted:#a7b5a8; --faint:#6f7f72;
  --accent:#3fa36b; --accent-ink:#06130b; --amber:#d9862a; --amber-ink:#1c1105;
  --good:#3fa36b; --bad:#e06b63; --warn:#d9862a;
  --s1:#3fa36b; --s2:#5b93d6;
  --hero:#0b1a11; --hero-fg:#f3f5ea; --hero-muted:#93a596;
  --heat0:#1a241d; --heat1:#234a32; --heat2:#2b6b45; --heat3:#36905a; --heat4:#4fbf7d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{background:var(--hero);color:var(--hero-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.topin{max-width:1180px;margin:0 auto;padding-block:14px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand .logo{width:46px;height:46px;flex:none}
.brand h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
.brand .sub{color:var(--hero-muted);font-size:.8rem}
.brand .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand>div:nth-child(2){min-width:0;flex:1 1 200px}
@media (max-width:640px){.brand .logo{width:36px;height:36px}.brand h1{font-size:1.3rem}.brand .sub{font-size:.72rem}.brand .right{flex:1 1 100%;margin-left:0}.search{flex:1}.search input{width:100%}}
.search{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:4px 10px;position:relative}
.search input{background:none;border:0;color:var(--hero-fg);font:inherit;width:180px;outline:none}
.search input::placeholder{color:var(--hero-muted)}
.search .sug{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;z-index:20}
.search .sug button{display:block;width:100%;text-align:left;padding:8px 10px}
.search .sug button:hover,.search .sug button:focus{background:var(--card2)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:10px 12px;font-family:var(--display);font-weight:700;font-size:.92rem;color:var(--hero-muted);border-bottom:3px solid transparent;white-space:nowrap;border-radius:4px 4px 0 0}
nav.tabs button[aria-selected="true"]{color:var(--hero-fg);border-bottom-color:var(--amber)}
nav.tabs button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}

main{max-width:1180px;margin:0 auto;padding-block:22px 60px;display:flex;flex-direction:column;gap:22px}
.view{display:flex;flex-direction:column;gap:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel.flat{box-shadow:none}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.panel-h p{color:var(--muted);font-size:.9rem;max-width:62ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--card2);border-radius:10px;padding:12px 14px;min-width:0}
.tile .v{font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:.78rem;color:var(--muted)}

/* awards */
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.award{position:relative;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer;text-align:left}
.award:hover{border-color:var(--accent)}
.award .ic{font-size:1.4rem;line-height:1}
.award .t{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.award .n{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.15}
.award .d{font-size:.85rem;color:var(--muted)}
.award .big{font-family:var(--mono);font-size:1.3rem;font-weight:600;color:var(--accent)}

/* ranking list */
.rank{display:flex;flex-direction:column}
.rank .row{display:grid;grid-template-columns:28px minmax(0,1.3fr) 64px 60px 132px 56px minmax(80px,1fr) 70px;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.rank .tee{display:flex;align-items:center}
.rank .tee select{width:100%;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font:inherit;font-size:.8rem;cursor:pointer}
.rank .tee select.changed{border-color:var(--amber);box-shadow:0 0 0 2px color-mix(in srgb,var(--amber) 25%,transparent)}
.rank .ch{font-family:var(--display);font-weight:800;font-size:1.2rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
.teebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.teebar select{padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font:inherit;font-size:.85rem}
.teebar button{padding:5px 10px;border-radius:6px;border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--muted)}
.teebar button:hover{color:var(--fg);border-color:var(--accent)}
.rank .row:hover{background:var(--card2)}
.rank .row.head{border-top:0;cursor:default;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rank .row.head:hover{background:none}
.rank .pos{font-family:var(--mono);color:var(--muted);text-align:right;font-size:.85rem}
.rank .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .nm small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.rank .ix{font-family:var(--display);font-weight:800;font-size:1.2rem;text-align:right;font-variant-numeric:tabular-nums}
.rank .dl{font-family:var(--mono);font-size:.85rem;text-align:right}
.rank .bar{height:10px;background:var(--card2);border-radius:5px;position:relative;overflow:hidden}
.rank .bar i{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:5px}
.rank .sp svg{display:block;width:100%;height:26px}
.rank.hb3 .row{grid-template-columns:24px minmax(0,1.4fr) 64px minmax(80px,1fr)}
@media (max-width:860px){.rank .row{grid-template-columns:24px minmax(0,1fr) 54px 118px 44px}.rank .bar,.rank .sp,.rank .hb,.rank .dl{display:none}.rank.hb3 .row{grid-template-columns:24px minmax(0,1fr) 60px}.rank.hb3 .bar{display:block}}
@media (max-width:420px){.rank .row{grid-template-columns:20px minmax(0,1fr) 50px 104px 40px;gap:6px}.rank .nm small{display:none}}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 8px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
th[data-sort]:hover{color:var(--fg)}
th .arrow{opacity:.5;font-size:.7em}
td.num,th.r{font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--card2)}
tr.me td{background:color-mix(in srgb,var(--amber) 12%,transparent)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.72rem;font-weight:600;letter-spacing:.03em}
.pill.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.b{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.n{background:var(--card2);color:var(--muted)}
.pill.a{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber-ink)}
:root[data-theme="dark"] .pill.a{color:var(--amber)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.a{color:var(--amber)}}

/* board chips (rankings tab) */
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.board li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.board li:hover{background:var(--card2)}
.board li .k{font-family:var(--mono);color:var(--muted);font-size:.8rem;text-align:right}
.board li .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board li .v{font-family:var(--mono);font-weight:600}
.board li.top .k{color:var(--amber);font-weight:700}
.board .foot{font-size:.78rem;color:var(--muted);margin-top:8px}

/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis line{stroke:var(--line)}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:.78rem;z-index:50;max-width:260px;white-space:pre-line;box-shadow:var(--shadow)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* heatmap */
.heat{display:grid;gap:3px;font-size:.78rem}
.heat .hrow{display:grid;grid-template-columns:minmax(110px,150px) repeat(12,minmax(0,1fr)) 44px;gap:3px;align-items:center}
.heat .hrow .hn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.heat .hrow .hn:hover{color:var(--accent)}
.heat .cell{aspect-ratio:1.6;border-radius:3px;background:var(--heat0);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.7rem;color:var(--fg);max-width:100%}
.heat .c1{background:var(--heat1)} .heat .c2{background:var(--heat2)} .heat .c3{background:var(--heat3);color:#fff} .heat .c4{background:var(--heat4);color:#fff}
.heat .hm{font-family:var(--mono);font-size:.68rem;color:var(--muted);text-align:center}
.heat .ht{font-family:var(--mono);text-align:right;color:var(--muted)}
.heat-wrap{overflow-x:auto}
.heat-wrap .heat{min-width:560px}

/* players grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.pcard:hover{border-color:var(--accent)}
.pcard .hd{display:flex;align-items:center;gap:10px}
.pcard .av{width:40px;height:40px;border-radius:50%;background:var(--hero);color:var(--hero-fg);font-family:var(--display);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:.9rem}
.pcard .nm{font-weight:600;line-height:1.2}
.pcard .nm small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
.pcard .ix{margin-left:auto;font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.pcard .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:var(--mono)}
.pcard svg{display:block;width:100%;height:34px}

/* player detail */
.phead{background:var(--hero);color:var(--hero-fg);border-radius:14px;padding:20px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.phead .big{font-family:var(--display);font-size:3.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.phead .nm{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1}
.phead .sub{color:var(--hero-muted);font-size:.85rem}
.phead .kv{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:.82rem;color:var(--hero-muted)}
.phead .kv b{color:var(--hero-fg);font-weight:600;font-family:var(--mono)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;padding:4px 0}
.back:hover{color:var(--accent)}
.dist{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--bg)}
.dist i{display:block;height:100%}
.dist-l{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:.8rem;margin-top:8px}
.dist-l span i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sc{border-top:0}
.sc table{font-family:var(--mono);font-size:.8rem}
.sc td,.sc th{padding:3px 5px;text-align:center;min-width:26px}
.sc td:first-child,.sc th:first-child{text-align:left;color:var(--muted);font-family:var(--body);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.sc td.eag{background:#e5b839;color:#2a1a05;border-radius:50%;font-weight:700}
.sc td.bir{outline:2px solid var(--good);outline-offset:-3px;border-radius:50%;color:var(--good);font-weight:700}
.sc td.bog{outline:1.5px solid var(--bad);outline-offset:-3px;color:var(--bad)}
.sc td.dbl{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad);font-weight:600}
.sc td.tri{background:var(--bad);color:#fff;font-weight:700}
.rtab tr.open td{background:var(--card2)}
.rtab .sc-row td{padding:8px}
.star{color:var(--amber);font-weight:700}

/* versus */
.vs-pick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.vs-pick select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font:inherit}
.vs-x{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--muted)}
.vs-rows{display:flex;flex-direction:column}
.vs-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,120px) minmax(0,1fr);gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.vs-row .m{text-align:center;font-size:.75rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.vs-row .a,.vs-row .b{display:flex;align-items:center;gap:8px}
.vs-row .b{flex-direction:row-reverse}
.vs-row .val{font-family:var(--mono);font-weight:600;min-width:52px}
.vs-row .b .val{text-align:right}
.vs-row .bar{flex:1;height:8px;background:var(--card2);border-radius:4px;overflow:hidden;position:relative}
.vs-row .a .bar i{position:absolute;right:0;top:0;bottom:0;background:var(--s1);border-radius:4px}
.vs-row .b .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--s2);border-radius:4px}
.vs-row.win-a .a .val{color:var(--s1)} .vs-row.win-b .b .val{color:var(--s2)}
@media (max-width:560px){.vs-row{grid-template-columns:minmax(0,1fr) 80px minmax(0,1fr)}.vs-row .bar{display:none}}

/* misc */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:5px 10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.note{font-size:.82rem;color:var(--muted);max-width:70ch}
.note b{color:var(--fg)}
footer{color:var(--muted);font-size:.8rem;max-width:1180px;margin:0 auto;padding-block:0 40px}
.holes{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px;align-items:end;height:120px}
.holes .h{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.holes .h i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.holes .h i.hard{background:var(--bad)}
.holes .h i.easy{background:var(--s2)}
.holes .h b{font-family:var(--mono);font-size:.68rem;color:var(--muted);font-weight:400}
.holes-wrap{overflow-x:auto;position:relative}.holes-wrap .holes{min-width:480px}
@media (max-width:560px){.holes-wrap::after{content:"← desliza para ver los 18 hoyos →";display:block;font-size:.72rem;color:var(--muted);text-align:center;padding-top:6px}}

/* player report extras */
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.75rem;font-weight:600;background:rgba(255,255,255,.1);color:var(--hero-fg);border:1px solid rgba(255,255,255,.16)}
.badge.warn{background:color-mix(in srgb,var(--amber) 30%,transparent);border-color:var(--amber)}
.subnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.subnav::-webkit-scrollbar{display:none}
.subnav a{text-decoration:none;font-size:.8rem;font-weight:600;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;background:var(--card)}
.subnav a:hover{color:var(--accent);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;flex-direction:column;align-items:center;padding:5px 9px;border-radius:8px;background:var(--card2);font-family:var(--mono);font-weight:600;font-size:.9rem;min-width:56px}
.chip small{font-weight:400;font-size:.65rem;color:var(--muted)}
.chip:last-child{outline:2px solid var(--amber);outline-offset:-2px}
details.dt summary{cursor:pointer;font-weight:600;color:var(--muted);padding:6px 0}
details.dt summary:hover{color:var(--accent)}
details.dt[open] summary{color:var(--fg)}
.holes.cmp{height:130px}
.holes.cmp .h{justify-content:center;display:grid;grid-template-rows:1fr 2px 1fr auto;align-items:end}
.holes.cmp .h .dn{align-self:start}
.holes.cmp .h span{display:block;width:100%;border-radius:3px}
.holes.cmp .h .up{background:var(--good);align-self:flex-end;border-radius:3px 3px 0 0}
.holes.cmp .h .mid{height:2px;background:var(--line);flex:none}
.holes.cmp .h .dn{background:var(--bad);border-radius:0 0 3px 3px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lnk{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;font-weight:600;font-size:.85rem;background:var(--card2)}
.lnk:hover{border-color:var(--accent);color:var(--accent)}
.tile .v small{font-weight:500}
tr.arch td{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.rank .bar i,.vs-row .bar i{transition:width .4s ease}}
</style>
</head>

const teeDefault = p => ({ 'Negras':'7254', 'Azules':'7020', 'Blancas':'6350', 'Doradas':'5731', 'Rojas':'5331' }[p.marcas] || '7254');
const courseHcp = (idx, t) => Math.round(idx * t.slope / 113 + (t.cr - t.par));
let teeChoice = {}; try { teeChoice = JSON.parse(localStorage.getItem('tortugas.tees')) || {}; } catch (e) {}
const teeFor = p => teeChoice[p.codigo] || teeDefault(p);

/* ---------- derive stats ---------- */
const P = DATA.jugadores;
const byCode = {};
P.forEach(p => byCode[p.codigo] = p);

function indexAt(p, iso) { // latest index entry on or before iso; else earliest known
  const h = p.historialIndice.slice().sort((a,b)=>a.fecha<b.fecha?-1:1);
  let v = null;
  for (const e of h) { if (e.fecha <= iso) v = e.indice; }
  if (v === null && h.length) v = h[0].indice;
  return v;
}
function validCard(r) {
  return r.hoyos === 18 && r.scores && r.pars && r.scores.every(x => x !== null) && r.scores.reduce((a,b)=>a+b,0) === r.gross && r.gross > 0;
}
P.forEach(p => {
  const R = p.rondas;                       // todo el historial acumulado (desc)
  p.r20 = R.filter(r => r.vigente !== false); // las 20 vigentes en Fedegolf
  const W = p.r20;
  const r18 = R.filter(r => r.gross && r.hoyos === 18);
  const difs = W.map(r => r.dif);
  const counting = W.filter(r => r.cuenta);
  const since = (days) => R.filter(r => daysBetween(r.fecha, TODAY) <= days);
  p.st = {
    n: R.length, n20: W.length, n30: since(30).length, n90: since(90).length, n365: since(365).length,
    lastRound: R.length ? R[0].fecha : null,
    daysSince: R.length ? daysBetween(R[0].fecha, TODAY) : null,
    avgDif: avg(difs), bestDif: Math.min(...difs), worstDif: Math.max(...difs),
    stdDif: std(difs), avgCounting: avg(counting.map(r=>r.dif)),
    avgGross: avg(r18.map(r=>r.gross)), bestGross: r18.length ? Math.min(...r18.map(r=>r.gross)) : null,
    worstGross: r18.length ? Math.max(...r18.map(r=>r.gross)) : null,
    idx90: indexAt(p, shiftDate(TODAY,-90)), idx30: indexAt(p, shiftDate(TODAY,-30)), idx365: indexAt(p, shiftDate(TODAY,-365)),
    hist: p.historialIndice.slice().sort((a,b)=>a.fecha<b.fecha?-1:1),
    best90: (()=>{ const s = since(90); return s.length ? s.reduce((a,b)=>a.dif<b.dif?a:b) : null; })(),
    span: R.length ? daysBetween(R[R.length-1].fecha, R[0].fecha) : 0,
  };
  p.st.d90 = p.st.idx90 === null ? null : p.indice - p.st.idx90;
  p.st.d30 = p.st.idx30 === null ? null : p.indice - p.st.idx30;
  p.st.d365 = p.st.idx365 === null ? null : p.indice - p.st.idx365;
  p.st.idxMin = Math.min(...p.st.hist.map(h=>h.indice));
  p.st.idxMax = Math.max(...p.st.hist.map(h=>h.indice));
  // hole stats
  const cards = R.filter(validCard);
  const hs = { rounds: cards.length, eagle:0, birdie:0, par:0, bogey:0, dbl:0, tri:0, holes:0,
    p3:[], p4:[], p5:[], front:[], back:[], worst:null };
  cards.forEach(r => {
    let f=0,b=0;
    r.scores.forEach((s,i) => {
      const d = s - r.pars[i]; hs.holes++;
      if (d <= -2) hs.eagle++; else if (d === -1) hs.birdie++; else if (d === 0) hs.par++; else if (d === 1) hs.bogey++; else if (d === 2) hs.dbl++; else hs.tri++;
      (r.pars[i]===3?hs.p3:r.pars[i]===4?hs.p4:hs.p5).push(d);
      if (i < 9) f += d; else b += d;
      if (!hs.worst || d > hs.worst.d) hs.worst = { d, s, par:r.pars[i], hole:i+1, fecha:r.fecha, cancha:r.cancha };
    });
    hs.front.push(f); hs.back.push(b);
  });
  hs.birdiesPerRound = cards.length ? (hs.birdie + hs.eagle) / cards.length : null;
  hs.parPct = hs.holes ? (hs.par + hs.birdie + hs.eagle) / hs.holes : null;
  hs.p3avg = avg(hs.p3); hs.p4avg = avg(hs.p4); hs.p5avg = avg(hs.p5);
  hs.frontAvg = avg(hs.front); hs.backAvg = avg(hs.back);
  hs.blowupPct = hs.holes ? (hs.dbl + hs.tri) / hs.holes : null;
  p.hs = hs;
});

/* playing partners: same date + time + course */
const groups = {};
P.forEach(p => p.rondas.forEach(r => {
  if (r.hora === '05:00' || !r.hora) return;
  const k = `${r.fecha}|${r.hora}|${r.cancha}`;
  (groups[k] = groups[k] || []).push(p.codigo);
}));
const partnerCount = {};
const sharedRounds = Object.entries(groups).filter(([k, v]) => new Set(v).size >= 2).map(([k,v]) => ({ key:k, fecha:k.split('|')[0], cancha:k.split('|')[2], who:[...new Set(v)] }));
sharedRounds.forEach(g => g.who.forEach(a => g.who.forEach(b => { if (a!==b) { partnerCount[a] = partnerCount[a]||{}; partnerCount[a][b] = (partnerCount[a][b]||0)+1; } })));
P.forEach(p => { const pc = partnerCount[p.codigo] || {}; p.partners = Object.entries(pc).map(([c,n])=>({p:byCode[c], n})).sort((a,b)=>b.n-a.n); p.sharedN = sharedRounds.filter(g=>g.who.includes(p.codigo)).length; });

/* group-level */
const active = P.filter(p => p.st.n365 >= 3);
const allRounds = P.flatMap(p => p.rondas.map(r => ({...r, p})));
/* period helpers (resumen) */
const PERIODS = [['15','15 días',15],['30','1 mes',30],['60','2 meses',60],['90','3 meses',90],['180','6 meses',180],['365','12 meses',365],['ytd','Este año (YTD)',null]];
let period = '90'; try { const sp = localStorage.getItem('tortugas.period'); if (PERIODS.some(x=>x[0]===sp)) period = sp; } catch (e) {}
function periodStart() { if (period === 'ytd') return TODAY.slice(0,4) + '-01-01'; return shiftDate(TODAY, -PERIODS.find(x=>x[0]===period)[2]); }
function periodLabel() { return PERIODS.find(x=>x[0]===period)[1]; }
function pstats(p) { const start = periodStart(); const rs = p.rondas.filter(r => r.fecha >= start); const idx0 = indexAt(p, start); return { n: rs.length, rounds: rs, idx0, d: idx0 === null ? null : p.indice - idx0, best: rs.length ? rs.reduce((a,b)=>a.dif<b.dif?a:b) : null }; }
const months = []; { let d = new Date(TODAY); d.setDate(1); for (let i=11;i>=0;i--){ const m = new Date(d.getFullYear(), d.getMonth()-i, 1); months.push(m.toISOString().slice(0,7)); } }

/* ---------- small helpers ---------- */
const tip = document.getElementById('tip');
function showTip(e, text) { tip.textContent = text; tip.hidden = false; moveTip(e); }
function moveTip(e) { const x = Math.min(e.clientX + 12, window.innerWidth - 270), y = e.clientY + 14; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
function hideTip() { tip.hidden = true; }
document.addEventListener('mousemove', e => { if (!tip.hidden) moveTip(e); });
function bindTips(root) {
  root.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', e => showTip(e, el.dataset.tip));
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('focus', e => { const r = el.getBoundingClientRect(); showTip({clientX:r.left, clientY:r.bottom}, el.dataset.tip); });
    el.addEventListener('blur', hideTip);
  });
}
const sign = v => v === null ? '<span class="muted">—</span>' : `<span class="${v<0?'pos':v>0?'neg':'muted'}">${fmtSigned(v)}</span>`;
const deltaPill = v => v === null ? '<span class="pill n">sin dato</span>' : v < -0.05 ? `<span class="pill g">▼ ${d2(Math.abs(v))} mejora</span>` : v > 0.05 ? `<span class="pill b">▲ ${d2(v)} sube</span>` : '<span class="pill n">= estable</span>';

/* sparkline: index history (chronological) */
function spark(vals, w=120, h=26, cls='') {
  if (vals.length < 2) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx - mn) || 1;
  const pts = vals.map((v,i) => [ (i/(vals.length-1))*(w-4)+2, h-3-((v-mn)/rg)*(h-6) ]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="${cls}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="var(--amber)"/></svg>`;
}

/* generic line chart: series = [{name,color,points:[{x(date iso),y,label}]}] */
function lineChart(series, opt = {}) {
  const W = opt.w || 720, H = opt.h || 240, m = {t:14,r:14,b:30,l:38};
  const all = series.flatMap(s => s.points);
  if (!all.length) return '<p class="muted">Sin datos.</p>';
  const xs = all.map(p => +new Date(p.x)), ys = all.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) { x0 -= MS*15; x1 += MS*15; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1-y0)*0.12 || 1; y0 -= pad; y1 += pad;
  if (opt.y0 !== undefined) y0 = Math.min(y0, opt.y0);
  const X = v => m.l + (v - x0)/(x1-x0)*(W-m.l-m.r), Y = v => m.t + (y1 - v)/(y1-y0)*(H-m.t-m.b);
  // y ticks
  const step = niceStep((y1-y0)/4); const ticks = []; for (let v = Math.ceil(y0/step)*step; v <= y1; v += step) ticks.push(+v.toFixed(2));
  // x ticks: months
  const xt = []; { const d = new Date(x0); d.setDate(1); d.setMonth(d.getMonth()+1); const span = (x1-x0)/MS; const every = span > 900 ? 6 : span > 400 ? 3 : span > 200 ? 2 : 1; let i=0; while (+d <= x1) { if (i % every === 0) xt.push(new Date(d)); d.setMonth(d.getMonth()+1); i++; } }
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'gráfica')}">`;
  g += '<g class="grid">' + ticks.map(t => `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/>`).join('') + '</g>';
  g += ticks.map(t => `<text x="${m.l-6}" y="${Y(t)+4}" text-anchor="end">${t}</text>`).join('');
  g += xt.map(d => `<text x="${X(+d)}" y="${H-10}" text-anchor="middle">${MESES[d.getMonth()]}${d.getMonth()===0||xt.length<4?' '+String(d.getFullYear()).slice(2):''}</text>`).join('');
  if (opt.refY !== undefined) g += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(opt.refY)}" y2="${Y(opt.refY)}" stroke="var(--amber)" stroke-dasharray="4 4"/><text x="${W-m.r}" y="${Y(opt.refY)-4}" text-anchor="end" fill="var(--amber)">${esc(opt.refLabel||'')}</text>`;
  series.forEach(s => {
    const pts = s.points.slice().sort((a,b)=>a.x<b.x?-1:1);
    const d = pts.map((p,i)=>(i?'L':'M')+X(+new Date(p.x)).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
    if (s.area) g += `<path d="${d} L${X(+new Date(pts[pts.length-1].x)).toFixed(1)} ${Y(y0)} L${X(+new Date(pts[0].x)).toFixed(1)} ${Y(y0)} Z" fill="${s.color}" opacity=".08"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.step?'':''}/>`;
    g += pts.map(p => `<circle cx="${X(+new Date(p.x)).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${p.big?5:3.5}" fill="${p.hl?'var(--amber)':s.color}" stroke="var(--card)" stroke-width="1.5" tabindex="0" data-tip="${esc(p.label||'')}"/>`).join('');
  });
  g += '</svg>';
  return g;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw||1))); const r = raw/p; return (r<1.5?1:r<3.5?2:r<7.5?5:10)*p; }

/* bar chart: items [{label, value, tip, color}] horizontal */
function hbars(items, opt={}) {
  const max = Math.max(...items.map(i=>Math.abs(i.value)), 0.001);
  return `<div class="rank hb3">` + items.map((it,i) => `<div class="row" data-code="${it.code||''}" role="button" tabindex="0"><span class="pos">${i+1}</span><span class="nm">${esc(it.label)}${it.sub?`<small>${esc(it.sub)}</small>`:''}</span><span class="ix" style="font-size:1rem">${it.fmt}</span><span class="bar" data-tip="${esc(it.tip||'')}"><i style="width:${Math.abs(it.value)/max*100}%;background:${it.color||'var(--accent)'}"></i></span></div>`).join('') + '</div>';
}

views.rankings = () => {

    { t:'Mejores en par 5', f:'Promedio sobre par en hoyos par 5', list:P.filter(p=>p.hs.rounds>=5).sort((a,b)=>a.hs.p5avg-b.hs.p5avg), v:p=>fmtSigned(p.hs.p5avg) },

      <div class="hrow"><span></span>${months.map(m=>`<span class="hm">${MESES[+m.slice(5)-1]}</span>`).join('')}<span class="hm">año</span></div>
      ${order.map(p=>`<div class="hrow"><span class="hn" data-code="${p.codigo}" role="button" tabindex="0">${esc(p.corto)}</span>${months.map(m=>{const n=cnt[p.codigo][m]||0;return `<span class="cell ${cls(n)}" data-tip="${esc(p.corto)} · ${MESES[+m.slice(5)-1]} ${m.slice(0,4)}: ${n} ronda${n===1?'':'s'}">${n||''}</span>`}).join('')}<span class="ht">${p.st.n365}</span></div>`).join('')}
    </div></div>
    <p class="note" style="margin-top:10px">Solo se ven las últimas 20 rondas de cada jugador en Fedegolf, así que quien juega mucho puede tener meses "vacíos" al principio del año aunque sí haya jugado.</p>

views.campos = () => {
  // Llano Grande hole difficulty (group), all tees (same pars)
  const LG = allRounds.filter(r => r.cancha === 'Llano Grande' && validCard(r));
  const pars = LG[0].pars, vent = LG[0].vent;
  const holeAvg = Array.from({length:18},(_,i)=>avg(LG.map(r=>r.scores[i]-pars[i])));
  const holeBird = Array.from({length:18},(_,i)=>LG.filter(r=>r.scores[i]-pars[i]<=-1).length/LG.length);
  const holeBlow = Array.from({length:18},(_,i)=>LG.filter(r=>r.scores[i]-pars[i]>=2).length/LG.length);
  const rankHard = holeAvg.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
  const hardest = rankHard.slice(0,3), easiest = rankHard.slice(-3).reverse();
  const mx = Math.max(...holeAvg);
  // per-course group stats
  const byC = {}; allRounds.forEach(r => { const k = r.cancha; byC[k] = byC[k]||{n:0, difs:[], gross:[], who:new Set(), tees:new Set(), club:r.club, cr:r.cr, slope:r.slope, par:r.par, best:null}; const c=byC[k]; c.n++; c.difs.push(r.dif); if (r.hoyos===18&&r.gross) c.gross.push(r.gross); c.who.add(r.p.codigo); c.tees.add(r.marca); if (!c.best || r.dif < c.best.dif) c.best = r; });
  const courses = Object.entries(byC).sort((a,b)=>b[1].n-a[1].n);
  // best rounds at Llano Grande
  const bestLG = allRounds.filter(r=>r.cancha==='Llano Grande'&&r.hoyos===18).sort((a,b)=>a.gross-b.gross||a.dif-b.dif).slice(0,10);
  // hole-in-one / eagle log
  const eagles = []; allRounds.filter(validCard).forEach(r => r.scores.forEach((s,i)=>{ if (s-r.pars[i] <= -2) eagles.push({p:r.p, fecha:r.fecha, cancha:r.cancha, hole:i+1, par:r.pars[i], s}); }));
  eagles.sort((a,b)=>a.fecha<b.fecha?1:-1);
  return `
  <section class="panel">
    <div class="panel-h"><h2>Llano Grande, hoyo por hoyo</h2><p>Promedio de golpes sobre par del grupo en cada hoyo, con ${LG.length} tarjetas de 18 hoyos. Rojo: los tres más difíciles; azul: los tres más fáciles.</p></div>
    <div class="holes-wrap"><div class="holes">${holeAvg.map((v,i)=>`<div class="h" data-tip="Hoyo ${i+1} · par ${pars[i]} · ventaja ${vent[i]}\n${fmtSigned(v)} sobre par en promedio\nbirdie o mejor: ${Math.round(holeBird[i]*100)}% · doble o peor: ${Math.round(holeBlow[i]*100)}%"><b>${fmtSigned(v)}</b><i class="${hardest.some(h=>h.i===i)?'hard':easiest.some(h=>h.i===i)?'easy':''}" style="height:${v/mx*78}%"></i><b>${i+1}</b></div>`).join('')}</div></div>
    <div class="grid g3" style="margin-top:14px">
      <div class="tile"><div class="l">Hoyos más difíciles</div><div class="v" style="font-size:1.1rem">${hardest.map(h=>`#${h.i+1} (par ${pars[h.i]}, ${fmtSigned(h.v)})`).join('<br>')}</div></div>
      <div class="tile"><div class="l">Hoyos más amables</div><div class="v" style="font-size:1.1rem">${easiest.map(h=>`#${h.i+1} (par ${pars[h.i]}, ${fmtSigned(h.v)})`).join('<br>')}</div></div>
      <div class="tile"><div class="l">Ida vs. vuelta</div><div class="v" style="font-size:1.1rem">${fmtSigned(holeAvg.slice(0,9).reduce((a,b)=>a+b,0))} · ${fmtSigned(holeAvg.slice(9).reduce((a,b)=>a+b,0))}</div><div class="l">sobre par, promedio del grupo</div></div>
    </div>
  </section>
  <section class="grid g2">
    <div class="panel">
      <div class="panel-h"><h3>Mejores rondas en Llano Grande</h3><p>Gross más bajo entre todas las tarjetas del grupo.</p></div>
      <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Jugador</th><th class="r">Gross</th><th class="r">Dif.</th><th>Marcas</th><th>Fecha</th></tr></thead><tbody>
      ${bestLG.map((r,i)=>`<tr class="click" data-code="${r.p.codigo}"><td class="num muted">${i+1}</td><td>${esc(r.p.corto)}</td><td class="r num"><b>${r.gross}</b></td><td class="r num">${fmtSigned(r.dif)}</td><td>${esc(r.marca)}</td><td class="num">${fmtDate(r.fecha)}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>Libro de eagles</h3><p>Hoyos jugados en dos golpes bajo par o mejor, en todas las canchas.</p></div>
      ${eagles.length ? `<div class="tbl-wrap"><table><thead><tr><th>Jugador</th><th>Cancha</th><th class="r">Hoyo</th><th class="r">Score</th><th>Fecha</th></tr></thead><tbody>${eagles.map(e=>`<tr class="click" data-code="${e.p.codigo}"><td>${esc(e.p.corto)}</td><td>${esc(e.cancha)}</td><td class="r num">${e.hole} (par ${e.par})</td><td class="r num"><b>${e.s}</b>${e.s===1?' 🕳️':''}</td><td class="num">${fmtDate(e.fecha)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Todavía ninguna tortuga ha hecho eagle en las tarjetas disponibles.</p>'}
    </div>
  </section>
  <section class="panel">
    <div class="panel-h"><h3>Todas las canchas del grupo</h3><p>Dónde han jugado las tortugas en sus últimas 20 rondas y cómo les fue.</p></div>
    <div class="tbl-wrap"><table><thead><tr><th>Cancha</th><th>Club</th><th class="r">Rondas</th><th class="r">Tortugas</th><th class="r">Dif. prom.</th><th class="r">Gross prom.</th><th>Mejor ronda</th></tr></thead><tbody>
    ${courses.map(([c,v])=>`<tr><td>${esc(c)}</td><td class="muted">${esc(v.club)}</td><td class="r num">${v.n}</td><td class="r num">${v.who.size}</td><td class="r num">${d2(avg(v.difs))}</td><td class="r num">${v.gross.length?d2(avg(v.gross)):'—'}</td><td>${v.best?`${esc(v.best.p.corto)} · ${v.best.gross||'—'} (${fmtSigned(v.best.dif)})`:''}</td></tr>`).join('')}
    </tbody></table></div>
  </section>`;
};

/* ---- extra derived data for the player report ---- */
const COURSE_TEES = (() => {
  const m = {};
  allRounds.forEach(r => { const k = `${r.cancha}|${r.marca}`; if (!m[k]) m[k] = { cancha:r.cancha, club:r.club, marca:r.marca, cr:r.cr, slope:r.slope, par:r.par, n:0 }; m[k].n++; });
  TEES.forEach(t => { const k = `Llano Grande|${t.yd} Caballeros`; m[k] = { cancha:'Llano Grande', club:'CC Medellin', marca:`${t.nombre} · ${t.yd}`, cr:t.cr, slope:t.slope, par:t.par, n:(m[k]?m[k].n:0), lg:true, ord:TEES.indexOf(t) }; });
  return Object.values(m).sort((a,b)=> (a.lg?0:1)-(b.lg?0:1) || (a.ord??0)-(b.ord??0) || b.n-a.n);
})();
const LG_GROUP = (() => { const LG = allRounds.filter(r => r.cancha === 'Llano Grande' && validCard(r)); if (!LG.length) return null; const pars = LG[0].pars; return { n:LG.length, pars, avg: Array.from({length:18},(_,i)=>avg(LG.map(r=>r.scores[i]-pars[i]))) }; })();
const rankingFor = code => DATA.ranking.categorias.flatMap(c => c.jugadores.filter(j=>j.codigo===code).map(j=>({...j, cat:c.nombre, total:c.total})));
const dayWinners = (() => { // for each shared round, who had the lowest differential
  const w = {}; sharedRounds.forEach(g => { const rs = g.who.map(c => { const r = byCode[c].rondas.find(x=>`${x.fecha}|${x.hora}|${x.cancha}`===g.key); return r? {c, dif:r.dif}:null; }).filter(Boolean); if (rs.length<2) return; const best = Math.min(...rs.map(x=>x.dif)); rs.forEach(x => { w[x.c] = w[x.c]||{n:0,wins:0}; w[x.c].n++; if (x.dif===best) w[x.c].wins++; }); }); return w; })();

  const bestIn = cards.reduce((m,r)=>{ const v=nine(r,9,18); return (!m||v<m.v)?{v,r}:m; },null);
  const birdieRound = cards.reduce((m,r)=>{ const v=r.scores.filter((s,i)=>s-r.pars[i]<=-1).length; return (!m||v>m.v)?{v,r}:m; },null);
  let streak=0, best=0, bestEnd=null, cur=0;
  cards.forEach(r => r.scores.forEach((s,i) => { if (s-r.pars[i] >= 2) { cur = 0; } else { cur++; if (cur>best) { best=cur; bestEnd={r,i}; } } }));

  const R = p.r20; if (R.length < 20) return null;

  const ifBad = avg(remaining); // index if the next round does not enter the top 8

      <div class="grid g2" style="margin-top:12px">

        <div class="tile"><div class="l">Tus hoyos a trabajar</div><div class="v" style="font-size:1rem">${weaknesses.map(x=>`#${x.i+1} <span class="neg">+${(x.d).toFixed(2)}</span> vs grupo`).join('<br>')}</div></div>
      </div>`:''}
    </div>
  </section>` : ''}

  <section class="panel" id="r-social">
    <div class="panel-h"><h3>Con quién sales y cómo te va</h3><p>Compañeros detectados por misma fecha, hora y cancha. "Balance" cuenta las veces que tu diferencial fue mejor que el de ese compañero en la misma salida.</p></div>
    ${p.partners.length ? `<div class="tbl-wrap"><table><thead><tr><th>Compañero</th><th class="r">Salidas juntos</th><th class="r">Balance (tú – él)</th><th></th></tr></thead><tbody>${partnersH2H.map(x=>`<tr class="click" data-code="${x.p.codigo}"><td>${esc(x.p.corto)} <span class="muted num">${d2(x.p.indice)}</span></td><td class="r num">${x.n}</td><td class="r num"><b class="${x.w>x.l?'pos':x.l>x.w?'neg':''}">${x.w} – ${x.l}</b></td><td><span class="pill n">ver cara a cara</span></td></tr>`).join('')}</tbody></table></div><p class="note" style="margin-top:8px">${p.sharedN} de tus ${s.n} rondas fueron con otra tortuga.</p>` : '<p class="muted">No apareces compartiendo salida con otra tortuga en tus últimas 20 rondas.</p>'}
  </section>

  <section class="panel" id="r-rondas">
    <div class="panel-h"><h3>Historial de rondas</h3><p>Toca una ronda para abrir la tarjeta hoyo a hoyo. ★ = cuenta entre los 8 mejores diferenciales. Las rondas marcadas "archivo" ya salieron de las 20 de Fedegolf pero el tablero las guarda.</p></div>
    <div class="tbl-wrap"><table class="rtab"><thead><tr><th>Fecha</th><th>Cancha</th><th>Marcas</th><th class="r">CR/Slope</th><th class="r">Gross</th><th class="r">Ajust.</th><th class="r">Dif.</th><th class="r">Hcp campo</th><th></th></tr></thead><tbody>
    ${R.map((r,i)=>`<tr class="click rr ${r.vigente===false?'arch':''}" data-i="${i}"><td class="num">${fmtDate(r.fecha)}${r.vigente===false?' <span class="pill n" data-tip="Ya no está entre las 20 de Fedegolf; se conserva en el archivo del tablero">archivo</span>':''}</td><td>${esc(r.cancha)}${r.club!=='CC Medellin'?`<span class="muted"> · ${esc(r.club)}</span>`:''}</td><td class="muted">${esc(r.marca)}</td><td class="r num muted">${r.cr}/${r.slope}</td><td class="r num"><b>${r.gross??'—'}</b>${r.hoyos&&r.hoyos!==18?`<span class="muted">/${r.hoyos}</span>`:''}</td><td class="r num">${r.ajustado??'—'}</td><td class="r num">${fmtSigned(r.dif)}</td><td class="r num muted">${r.hcpCampo??'—'}</td><td>${r.cuenta?'<span class="star">★</span>':''}${r.tipo!=='Aceptable'?`<span class="pill b">${esc(r.tipo)}</span>`:''}</td></tr><tr class="sc-row" hidden><td colspan="9">${scorecard(r)}</td></tr>`).join('')}
    </tbody></table></div>
  </section>

  <section class="panel" id="r-docs">
    <div class="panel-h"><h3>Certificados y consulta oficial</h3><p>Documentos generados por Fedegolf con tus datos (se abren en su sitio).</p></div>
    <div class="links">
      <a class="lnk" href="${sfBase}/apex/kardex?id=${encodeURIComponent(p.id)}" target="_blank" rel="noopener">📄 Certificado Kárdex (últimos 20 scores)</a>
      <a class="lnk" href="${sfBase}/apex/CertificadoDeIndicePDF?id=${encodeURIComponent(p.id)}" target="_blank" rel="noopener">📄 Certificado de índice</a>
      <a class="lnk" href="${sfBase}/apex/HistorialJuegoResultadoPp?user=${encodeURIComponent(p.id)}" target="_blank" rel="noopener">🔎 Historial de juego en Fedegolf</a>
      <a class="lnk" href="https://federacioncolombianadegolf.com/handicap/" target="_blank" rel="noopener">🔎 Consulta de hándicap (código ${p.codigo})</a>
    </div>
    <p class="note" style="margin-top:8px">Link directo a esta ficha para compartir: el enlace del tablero seguido de <b class="num">#j-${p.codigo}</b>.</p>
  </section>`;
}

function scorecard(r) {
  if (!r.scores || !r.pars || r.scores.reduce((a,b)=>a+(b||0),0) === 0) return '<p class="muted">Tarjeta no disponible para esta ronda.</p>';
  const cls = (s,p) => { const d = s-p; return d<=-2?'eag':d===-1?'bir':d===0?'':d===1?'bog':d===2?'dbl':'tri'; };
  const row = (label, arr, fn, nosum) => `<tr><td>${label}</td>${arr.slice(0,9).map((v,i)=>`<td class="${fn?fn(v,i):''}">${v??''}</td>`).join('')}<td><b>${nosum?'':sum(arr.slice(0,9))}</b></td>${arr.slice(9).map((v,i)=>`<td class="${fn?fn(v,i+9):''}">${v??''}</td>`).join('')}<td><b>${nosum?'':sum(arr.slice(9))}</b></td><td><b>${nosum?'':sum(arr)}</b></td></tr>`;
  const sum = a => a.reduce((x,y)=>x+(y||0),0);
  const meta = `${fmtLong(r.fecha)}${r.hora?' · salida '+r.hora:''} · ${esc(r.cancha)} · ${esc(r.marca)} · par ${r.par} · CR ${r.cr} · slope ${r.slope}`;
  return `<div class="sc"><div class="muted" style="font-size:.8rem;margin-bottom:6px">${meta}</div><div class="tbl-wrap"><table>
  <thead><tr><th>Hoyo</th>${[1,2,3,4,5,6,7,8,9].map(i=>`<th>${i}</th>`).join('')}<th>Ida</th>${[10,11,12,13,14,15,16,17,18].map(i=>`<th>${i}</th>`).join('')}<th>Vta</th><th>Tot</th></tr></thead>
  <tbody>${row('Par', r.pars)}${r.vent?row('Vent.', r.vent, null, true):''}${row('Score', r.scores, (v,i)=>cls(v,r.pars[i]))}${r.adj && r.adj.some((v,i)=>v!==r.scores[i])?row('Ajust.', r.adj):''}</tbody></table></div>
  <div class="dist-l" style="font-size:.72rem"><span><i style="background:#e5b839"></i>eagle</span><span><i style="background:var(--good)"></i>birdie</span><span><i style="background:color-mix(in srgb,var(--bad) 45%,var(--card))"></i>bogey</span><span><i style="background:color-mix(in srgb,var(--bad) 75%,var(--card))"></i>doble</span><span><i style="background:var(--bad)"></i>triple+</span></div></div>`;
}

views.versus = (a, b) => {
  const sorted = P.slice().sort((x,y)=>x.indice-y.indice);
  a = byCode[a] || sorted[0]; b = byCode[b] || sorted[1];
  const opts = sel => sorted.map(p=>`<option value="${p.codigo}" ${p.codigo===sel.codigo?'selected':''}>${esc(p.corto)} (${d2(p.indice)})</option>`).join('');
  const rows = [
    ['Índice', p=>p.indice, v=>d2(v), 'low'],
    ['Índice hace 3 meses', p=>p.st.idx90, v=>v===null?'—':d2(v), 'low'],
    ['Diferencial promedio', p=>p.st.avgDif, v=>d2(v), 'low'],
    ['Mejor diferencial', p=>p.st.bestDif, v=>fmtSigned(v), 'low'],
    ['Peor diferencial', p=>p.st.worstDif, v=>fmtSigned(v), 'low'],
    ['Consistencia (σ)', p=>p.st.stdDif, v=>v===null?'—':d2(v), 'low'],
    ['Gross promedio', p=>p.st.avgGross, v=>v===null?'—':d2(v), 'low'],
    ['Mejor gross', p=>p.st.bestGross, v=>v??'—', 'low'],
    ['Rondas último año', p=>p.st.n365, v=>v, 'high'],
    ['Días sin jugar', p=>p.st.daysSince, v=>v, 'low'],
    ['Birdies por ronda', p=>p.hs.rounds?p.hs.birdiesPerRound:null, v=>v===null?'—':v.toFixed(2), 'high'],
    ['% hoyos en par o mejor', p=>p.hs.rounds?p.hs.parPct*100:null, v=>v===null?'—':Math.round(v)+'%', 'high'],
    ['% dobles o peor', p=>p.hs.rounds?p.hs.blowupPct*100:null, v=>v===null?'—':v.toFixed(1)+'%', 'low'],
    ['Par 3 (sobre par)', p=>p.hs.p3avg, v=>v===null?'—':fmtSigned(v), 'low'],
    ['Par 4 (sobre par)', p=>p.hs.p4avg, v=>v===null?'—':fmtSigned(v), 'low'],
    ['Par 5 (sobre par)', p=>p.hs.p5avg, v=>v===null?'—':fmtSigned(v), 'low'],
  ];
  const together = sharedRounds.filter(g=>g.who.includes(a.codigo)&&g.who.includes(b.codigo)).sort((x,y)=>x.fecha<y.fecha?1:-1);
  const h2h = together.map(g => { const ra = a.rondas.find(r=>`${r.fecha}|${r.hora}|${r.cancha}`===g.key), rb = b.rondas.find(r=>`${r.fecha}|${r.hora}|${r.cancha}`===g.key); return {g, ra, rb}; }).filter(x=>x.ra&&x.rb);
  const winsA = h2h.filter(x=>x.ra.dif<x.rb.dif).length, winsB = h2h.filter(x=>x.rb.dif<x.ra.dif).length;
  const grossA = h2h.filter(x=>x.ra.gross&&x.rb.gross&&x.ra.gross<x.rb.gross).length, grossB = h2h.filter(x=>x.ra.gross&&x.rb.gross&&x.rb.gross<x.ra.gross).length;
  let wa=0, wb=0;
  const body = rows.map(([lab,f,fmt,dir]) => { const va=f(a), vb=f(b); let win=''; if (va!==null&&vb!==null&&va!==vb) win = (dir==='low'?va<vb:va>vb)?'win-a':'win-b'; if (win==='win-a') wa++; if (win==='win-b') wb++; const mx = Math.max(Math.abs(va||0),Math.abs(vb||0))||1; return `<div class="vs-row ${win}"><div class="a"><span class="val">${fmt(va)}</span><span class="bar"><i style="width:${Math.abs(va||0)/mx*100}%"></i></span></div><div class="m">${lab}</div><div class="b"><span class="val">${fmt(vb)}</span><span class="bar"><i style="width:${Math.abs(vb||0)/mx*100}%"></i></span></div></div>`; }).join('');
  const cmp = [{ name:a.corto, color:'var(--s1)', points:a.st.hist.filter(e=>daysBetween(e.fecha,TODAY)<=365).map(e=>({x:e.fecha,y:e.indice,label:`${a.corto} · ${fmtLong(e.fecha)}: ${d2(e.indice)}`})) },{ name:b.corto, color:'var(--s2)', points:b.st.hist.filter(e=>daysBetween(e.fecha,TODAY)<=365).map(e=>({x:e.fecha,y:e.indice,label:`${b.corto} · ${fmtLong(e.fecha)}: ${d2(e.indice)}`})) }];
  return `
  <section class="panel">
    <div class="panel-h"><h2>Cara a cara</h2><p>Elige dos tortugas. El color marca quién gana cada métrica; abajo, el historial real de las veces que salieron juntos.</p></div>
    <div class="vs-pick"><select id="vsA" aria-label="Jugador A">${opts(a)}</select><span class="vs-x">vs</span><select id="vsB" aria-label="Jugador B">${opts(b)}</select></div>
    <div class="tiles" style="margin-top:14px;grid-template-columns:1fr 1fr">
      <div class="tile" style="border-left:4px solid var(--s1)"><div class="v">${wa}</div><div class="l">métricas a favor de ${esc(a.corto)}</div></div>
      <div class="tile" style="border-right:4px solid var(--s2);text-align:right"><div class="v">${wb}</div><div class="l">métricas a favor de ${esc(b.corto)}</div></div>
    </div>
    <div class="vs-rows" style="margin-top:10px">${body}</div>
  </section>
  <section class="grid g2">
    <div class="panel">
      <div class="panel-h"><h3>Índice en el último año</h3></div>
      <div class="chart">${lineChart(cmp,{h:220,aria:'Comparación de índices'})}</div>
      <div class="legend"><span><i style="background:var(--s1)"></i>${esc(a.corto)}</span><span><i style="background:var(--s2)"></i>${esc(b.corto)}</span></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>Cuando han salido juntos</h3><p>${h2h.length?`${h2h.length} salida${h2h.length===1?'':'s'} compartida${h2h.length===1?'':'s'} · por diferencial: ${esc(a.corto.split(' ')[0])} ${winsA} – ${winsB} ${esc(b.corto.split(' ')[0])}${grossA+grossB?` · por gross: ${grossA} – ${grossB}`:''}`:'No hay salidas compartidas en sus últimas 20 rondas.'}</p></div>
      ${h2h.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Cancha</th><th class="r">${esc(a.corto.split(' ')[0])}</th><th class="r">${esc(b.corto.split(' ')[0])}</th><th>Ganó</th></tr></thead><tbody>${h2h.map(x=>`<tr><td class="num">${fmtDate(x.g.fecha)}</td><td>${esc(x.g.cancha)}</td><td class="r num">${x.ra.gross??'—'} <span class="muted">(${fmtSigned(x.ra.dif)})</span></td><td class="r num">${x.rb.gross??'—'} <span class="muted">(${fmtSigned(x.rb.dif)})</span></td><td>${x.ra.dif<x.rb.dif?`<span style="color:var(--s1);font-weight:600">${esc(a.corto.split(' ')[0])}</span>`:x.rb.dif<x.ra.dif?`<span style="color:var(--s2);font-weight:600">${esc(b.corto.split(' ')[0])}</span>`:'empate'}</td></tr>`).join('')}</tbody></table></div><p class="note" style="margin-top:8px">"Ganó" compara el diferencial (ajustado por dificultad de marcas), no el gross.</p>`:''}
    </div>
  </section>`;
};

views.acerca = () => `
  <section class="panel">
    <div class="panel-h"><h2>Cómo se calcula todo esto</h2></div>
    <div style="display:flex;flex-direction:column;gap:14px;max-width:70ch">
      <p><b>De dónde salen los datos.</b> Todo viene de la consulta pública de hándicap de la Federación Colombiana de Golf: el índice vigente de cada jugador, su historial de liquidaciones (al corte y al día), las últimas 20 rondas reportadas y la tarjeta hoyo a hoyo de cada una. No hay nada estimado ni digitado a mano.</p>
      <p><b>Índice WHS.</b> El índice es el promedio de los 8 mejores diferenciales entre las últimas 20 rondas (con ajustes cuando hay menos de 20). En las fichas, las rondas marcadas con ★ son las que Fedegolf tiene contando para el índice en este momento.</p>
      <p><b>Diferencial.</b> (113 ÷ slope) × (gross ajustado − course rating). Por eso un 89 en Llano Grande desde las negras (CR 74.7, slope 142) puede valer lo mismo que un 86 desde las azules. "Mejor ronda" y los cara a cara comparan diferenciales, que es la forma justa de comparar rondas en canchas o marcas distintas.</p>
      <p><b>Mejora y retroceso.</b> Se compara el índice vigente con el índice que Fedegolf tenía liquidado hace 30 días, 3 meses y 12 meses. Negativo es mejora.</p>
      <p><b>Consistencia (σ).</b> Desviación estándar de los 20 diferenciales. Un σ de 3 significa que casi todas las rondas caen a ±3 del promedio; un σ de 6 es una montaña rusa. Solo se rankea a jugadores con 3 o más rondas en el último año.</p>
      <p><b>Estadísticas por hoyo.</b> Solo se usan tarjetas de 18 hoyos cuya suma coincide con el gross reportado. Rondas de 9 hoyos y tarjetas incompletas se excluyen de birdies, pares, dobles y promedios por par.</p>
      <p><b>Salidas compartidas.</b> Dos tortugas "salieron juntas" cuando sus tarjetas tienen la misma fecha, la misma hora de salida y la misma cancha. Es una aproximación: puede faltar alguna salida real y nunca inventa una.</p>
      <p><b>Tope (cap) del WHS.</b> El índice no puede subir libremente: a partir de 3.0 por encima de tu índice mínimo de los últimos 12 meses sube a la mitad (soft cap) y nunca más de 5.0 (hard cap). Cuando Fedegolf aplica un tope, la ficha lo marca y muestra el promedio real de tus 8 mejores junto al índice publicado.</p>
      <p><b>Ranking Nacional.</b> Posiciones, puntos y movimiento tal como los publica Fedegolf en el Ranking Nacional de Aficionados por categoría. Solo aparecen jugadores con puntos en torneos federados.</p>
      <p><b>Récords y rachas.</b> Mejor ida, mejor vuelta, birdies en una ronda, rachas sin doble bogey y en par o mejor se calculan sobre las tarjetas de 18 hoyos, en orden cronológico; una racha puede cruzar de una ronda a la siguiente.</p>
      <p><b>Límite de 20 rondas y archivo del tablero.</b> Fedegolf solo expone las últimas 20 rondas por jugador. Por eso el tablero guarda un archivo propio: en cada actualización se agregan las rondas nuevas sin borrar las que ya salieron de Fedegolf. Los cálculos del índice (los 8 que cuentan, diferencial a batir, ronda que se cae) usan solo las 20 vigentes; récords, actividad, promedios por hoyo y compañeros usan todo el archivo, que crece con el tiempo.</p>
      <p><b>Actualización.</b> Datos tomados el ${fmtLong(TODAY)}. Para refrescar el tablero se vuelve a consultar Fedegolf para los 23 códigos y se republica en este mismo enlace.</p>
    </div>
  </section>`;

/* ---------- router ---------- */
let state = { view:'resumen', code:null, a:null, b:null };
function render(keep) {
  const sy = window.scrollY;
  const v = state.view;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === v ? 'true' : 'false'));
  let html = '';
  if (v === 'jugadores') html = views.jugadores(state.code);
  else if (v === 'versus') html = views.versus(state.a, state.b);
  else html = views[v] ? views[v]() : views.resumen();
  main.innerHTML = `<div class="view">${html}</div>`;
  bindTips(main);
  main.querySelectorAll('[data-code]').forEach(el => {
    const go = e => { e.stopPropagation(); openPlayer(el.dataset.code); };
    el.addEventListener('click', go);
    if (el.getAttribute('role') === 'button') el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(e); } });
  });
  main.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => nav(el.dataset.nav)));
  main.querySelectorAll('tr.rr').forEach(tr => tr.addEventListener('click', () => { const nx = tr.nextElementSibling; const open = !nx.hidden; main.querySelectorAll('tr.sc-row').forEach(x=>x.hidden=true); main.querySelectorAll('tr.rr').forEach(x=>x.classList.remove('open')); if (!open) { nx.hidden = false; tr.classList.add('open'); } }));
  const saveTees = () => { try { localStorage.setItem('tortugas.tees', JSON.stringify(teeChoice)); } catch (e) {} };
  main.querySelectorAll('select.teeSel').forEach(sel => {
    sel.addEventListener('click', e => e.stopPropagation());
    sel.addEventListener('keydown', e => e.stopPropagation());
    sel.addEventListener('change', e => { e.stopPropagation(); const p = byCode[sel.dataset.tee]; if (sel.value === teeDefault(p)) delete teeChoice[p.codigo]; else teeChoice[p.codigo] = sel.value; saveTees(); render(true); });
  });
  const periodSel = document.getElementById('periodSel');
  if (periodSel) periodSel.addEventListener('change', () => { period = periodSel.value; try { localStorage.setItem('tortugas.period', period); } catch (e) {} render(true); });
  const teeAll = document.getElementById('teeAll');
  if (teeAll) {
    teeAll.addEventListener('change', () => { if (!teeAll.value) { teeChoice = {}; } else { teeChoice = {}; P.forEach(p => { if (teeAll.value !== teeDefault(p)) teeChoice[p.codigo] = teeAll.value; }); } saveTees(); render(true); });
    document.getElementById('teeReset').addEventListener('click', () => { teeChoice = {}; saveTees(); render(true); });
  }
  const A = document.getElementById('vsA'), B = document.getElementById('vsB');
  if (A) { A.addEventListener('change', () => { state.a = A.value; render(); }); B.addEventListener('change', () => { state.b = B.value; render(); }); }
  window.scrollTo({ top: keep ? sy : 0 });
  try { localStorage.setItem('tortugas.view', JSON.stringify(state)); } catch (e) {}
}
function nav(view) { state.view = view; state.code = null; render(); }
function openPlayer(code) { state.view = 'jugadores'; state.code = String(code); render(); }
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => nav(b.dataset.view)));

/* search */
const q = document.getElementById('q'), sug = document.getElementById('sug');
function norm(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
q.addEventListener('input', () => {
  const t = norm(q.value.trim()); if (!t) { sug.hidden = true; return; }
  const hits = P.filter(p => norm(p.nombre).includes(t) || String(p.codigo).startsWith(t)).slice(0,6);
  sug.innerHTML = hits.map(p=>`<button data-c="${p.codigo}">${esc(p.corto)} <span class="muted num">${d2(p.indice)}</span></button>`).join('') || '<button disabled class="muted">Sin resultados</button>';
  sug.hidden = false;
  sug.querySelectorAll('button[data-c]').forEach(b => b.addEventListener('click', () => { openPlayer(b.dataset.c); q.value=''; sug.hidden = true; }));
});
q.addEventListener('keydown', e => { if (e.key === 'Enter') { const b = sug.querySelector('button[data-c]'); if (b) b.click(); } if (e.key === 'Escape') sug.hidden = true; });
document.addEventListener('click', e => { if (!e.target.closest('.search')) sug.hidden = true; });

document.getElementById('upd').textContent = fmtLong(TODAY);
/* initial view: hash token, else remembered, else resumen */
(() => {
  const h = location.hash.replace('#','');
  if (h.startsWith('j-') && byCode[h.slice(2)]) { state.view='jugadores'; state.code=h.slice(2); }
  else if (views[h]) state.view = h;
  else { try { const s = JSON.parse(localStorage.getItem('tortugas.view')); if (s && views[s.view]) state = {...state, ...s}; } catch(e){} }
  render();
})();
})();
</script>

</body>
